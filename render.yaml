services:
  - type: web
    name: lingxi-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANALYTICS_HASH_SALT
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:3001,https://web-pink-ten-h8p4acc4mb.vercel.app
